# Virtual webcam fed by the built-in camera through libcamera.
#
# exclusive_caps=1 is mandatory: browsers skip any device that also
# advertises the output capability. The capture capability then only appears
# once a producer has written its first frame.
options v4l2loopback devices=1 video_nr=42 card_label="IPU7-Camera" exclusive_caps=1 max_buffers=8
